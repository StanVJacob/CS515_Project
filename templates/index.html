<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Real-Time Play Translation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <h1>Real-Time Play Translation</h1>
    <p class="hint">
      Speak English into the microphone. The app will translate what you say live.
    </p>

    <!-- Shown only when the browser lacks Web Speech API support. -->
    <div id="unsupported" class="error" hidden>
      This app requires Chrome or Edge (Web Speech API is not available in
      your current browser).
    </div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="stop-btn" disabled>Stop</button>
    </div>

    <section>
      <h2>English (recognized)</h2>
      <div id="original" class="output"></div>
    </section>

    <section>
      <h2>Chinese Translation</h2>
      <div id="translation" class="output"></div>
    </section>
  </main>

  <script>
    // --- Feature detection ---------------------------------------------------
    // Web Speech API is exposed as `webkitSpeechRecognition` in Chrome/Edge.
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById("unsupported").hidden = false;
      document.getElementById("start-btn").disabled = true;
    }

    // --- DOM handles ---------------------------------------------------------
    const startBtn    = document.getElementById("start-btn");
    const stopBtn     = document.getElementById("stop-btn");
    const originalEl  = document.getElementById("original");
    const translateEl = document.getElementById("translation");

    // --- Speech recognition setup -------------------------------------------
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";      // always recognize English
      recognition.continuous = true;    // keep listening across pauses
      recognition.interimResults = true; // stream partial transcripts

      // Each fired event may contain both interim (still changing) and final
      // (locked in) results. We render interim text in grey italic, and when a
      // segment goes final we ship it off to the backend to translate.
      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = result[0].transcript;
          if (result.isFinal) {
            appendFinalOriginal(transcript);
            requestTranslation(transcript);
          } else {
            interim += transcript;
          }
        }
        renderInterim(interim);
        scheduleInterimTranslation(interim);
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
      };

      recognition.onend = () => {
        // Auto-restart if the user hasn't explicitly stopped; Chrome cuts the
        // session after ~1 minute of silence even with continuous=true.
        if (!manuallyStopped) {
          try { recognition.start(); } catch (_) { /* already started */ }
        }
      };
    }

    // --- UI helpers ----------------------------------------------------------
    let manuallyStopped = true;

    // Interim text lives at the bottom of #original in a grey italic span. It
    // gets replaced each time new interim results arrive.
    function renderInterim(text) {
      let span = document.getElementById("interim-span");
      if (!span) {
        span = document.createElement("span");
        span.id = "interim-span";
        span.className = "interim";
        originalEl.appendChild(span);
      }
      span.textContent = " " + text;

      originalEl.scrollTop = originalEl.scrollHeight;
    }

    function appendFinalOriginal(text) {
      const span = document.getElementById("interim-span");
      if (span) span.remove();

      // make previous lines gray
      const prev = originalEl.querySelectorAll("p");
      prev.forEach(p => p.classList.remove("latest"));

      const p = document.createElement("p");
      p.textContent = text.trim();
      p.classList.add("latest");  // NEW LINE

      originalEl.appendChild(p);

      // auto scroll
      originalEl.scrollTop = originalEl.scrollHeight;
    }

    function appendTranslation(text) {
      const span = document.getElementById("interim-translation-span");
      if (span) span.remove();

      // make previous lines gray
      const prev = translateEl.querySelectorAll("p");
      prev.forEach(p => p.classList.remove("latest"));

      const p = document.createElement("p");
      p.textContent = text;
      p.classList.add("latest");

      translateEl.appendChild(p);

      // auto scroll
      translateEl.scrollTop = translateEl.scrollHeight;
    }

    // Live interim translation lives at the bottom of #translation in a grey
    // italic span. It gets replaced each time new interim results arrive, and
    // is removed when a final translation lands on top of it.
    function renderInterimTranslation(text) {
      let span = document.getElementById("interim-translation-span");
      if (!span) {
        span = document.createElement("span");
        span.id = "interim-translation-span";
        span.className = "interim";
        translateEl.appendChild(span);
      }
      span.textContent = " " + text;

      translateEl.scrollTop = translateEl.scrollHeight;
    }

    // --- Backend call --------------------------------------------------------
    function requestTranslation(text) {
      fetch("/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      })
        .then((r) => r.json())
        .then((data) => {
          if (data.error) {
            appendTranslation("[error: " + data.error + "]");
          } else {
            appendTranslation(data.translation);
          }
        })
        .catch((err) => {
          appendTranslation("[network error: " + err.message + "]");
        });
    }

    // Throttled interim translation. Guarantees at least one translation
    // request every INTERIM_THROTTLE_MS even during continuous speech (where
    // a pure debounce would never fire because each new interim event keeps
    // resetting the timer). Leading-edge: fire immediately on first update.
    // Trailing-edge: after the throttle window, fire once more with the
    // latest pending text so we don't miss the most recent snapshot.
    // A sequence number drops out-of-order responses.
    const INTERIM_THROTTLE_MS = 600;
    let interimTranslationLastFired = 0;
    let interimTranslationPending = null;
    let interimTranslationTrailingTimer = null;
    let interimTranslationSeq = 0;

    function scheduleInterimTranslation(text) {
      const trimmed = text.trim();
      if (!trimmed) {
        renderInterimTranslation("");
        interimTranslationPending = null;
        clearTimeout(interimTranslationTrailingTimer);
        return;
      }
      interimTranslationPending = trimmed;

      const elapsed = Date.now() - interimTranslationLastFired;
      if (elapsed >= INTERIM_THROTTLE_MS) {
        fireInterimTranslation();
      } else {
        clearTimeout(interimTranslationTrailingTimer);
        interimTranslationTrailingTimer = setTimeout(
          fireInterimTranslation,
          INTERIM_THROTTLE_MS - elapsed
        );
      }
    }

    function fireInterimTranslation() {
      if (!interimTranslationPending) return;
      const text = interimTranslationPending;
      interimTranslationPending = null;
      interimTranslationLastFired = Date.now();

      const seq = ++interimTranslationSeq;
      fetch("/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      })
        .then((r) => r.json())
        .then((data) => {
          if (seq !== interimTranslationSeq) return; // stale, drop it
          if (data.error) {
            renderInterimTranslation("[" + data.error + "]");
          } else {
            renderInterimTranslation(data.translation || "");
          }
        })
        .catch(() => {
          // Silently swallow interim errors; the final translation will
          // still be attempted via requestTranslation when isFinal lands.
        });
    }

    // --- Button wiring -------------------------------------------------------
    startBtn.addEventListener("click", () => {
      if (!recognition) return;
      manuallyStopped = false;
      recognition.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener("click", () => {
      if (!recognition) return;
      manuallyStopped = true;
      recognition.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });
  </script>
</body>
</html>
